# ---------------------------------------------------------------------------
# Levi7's blog — site configuration (Hugo)
# Theme: hello-friend-ng (MIT) https://github.com/rhazdon/hugo-theme-hello-friend-ng
# ---------------------------------------------------------------------------

# Change this if the site is published somewhere else (custom domain, user page, ...).
baseURL = "https://dizzy-77.github.io/"

title        = "Levi7"
locale       = "en-us"

# Language of the content in ./content. Add [languages.xx] blocks below to go
# multilingual (the theme ships a global language menu).
defaultContentLanguage = "en"

theme = "hello-friend-ng"

PygmentsCodeFences = true
PygmentsStyle      = "monokai"

copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License." # Only used by the RSS template.

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
staticDir    = "static"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false
canonifyURLs = false

enableRobotsTXT     = true
enableGitInfo       = false
enableEmoji         = true
enableMissingTranslationPlaceholders = false
disableRSS          = false
disableSitemap      = false
disable404          = false
disableHugoGeneratorInject = false

[pagination]
  disableAliases = false
  pagerSize      = 20
  path           = 'page'

[services]
  [services.rss]
      # Maximum number of items in the RSS feed.
      limit = 42

#   [services.disqus]
#     shortname = 'your-disqus-shortname'
#   [services.googleAnalytics]
#     ID = 'G-MEASUREMENT_ID'

[permalinks]
  posts = "/posts/:year/:month/:title/"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Metadata mostly used in document's head
  description = "Levi7's personal blog"
  keywords    = ""
  images      = [""]

  # Big heading on the home page (falls back to `title` when empty).
  homeTitle = "Hi Stranger"

  # Home subtitle of the index page (typed character by character - see
  # layouts/partials/subtitle.html).
  homeSubtitle = "Welcome to my blog."

  # Set a background for the homepage
  # backgroundImage = "assets/images/background.jpg"

  # Prefix of link to the git commit detail page. GitInfo must be enabled.
  # gitUrl = ""

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  disableReadOtherPosts = false

  # Enable theme toggle (light/dark). Off by default: the theme follows the OS.
  enableThemeToggle = true

  # Sharing buttons
  enableSharingButtons = true

  # Reading time on post info
  enableReadingTime = true

  # Global language menu
  enableGlobalLanguageMenu = true

  # Add extra javascript / stylesheets here, e.g. "css/styles.css" or an http url.
  customCSS = []
  customJS  = []

  # Integrate Plausible.io
  # plausibleDataDomain = 'test.com'
  # plausibleScriptSource = 'https://plausible.io/js/script.js'

  [params.author]
    name = "Levi7"

  [params.footer]
    trademark = 2026
    rss       = true
    copyright = true
    author    = true

    topText = []
    bottomText = [
      "Powered by <a href=\"https://gohugo.io\">Hugo</a>",
      "Theme <a href=\"https://github.com/rhazdon/hugo-theme-hello-friend-ng\">Hello Friend NG</a> by Djordje Atlialp"
    ]

  [params.favicon.color]
    mask          = "#1b1c1d"
    msapplication = "#1b1c1d"
    theme         = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/levi7"
    logoHomeLink = "/"

  # Addon: Startpage portrait
  # [params.portrait]
  #   path     = "/img/portrait.jpg"
  #   alt      = "Portrait"
  #   maxWidth = "150px"

  # Addon: Utteranc.es comments (GitHub issues backed)
  # [params.utterances]
  #   repository = "dizzy-77/dizzy-77.github.io"
  #   label      = "comments"
  #   issueTerm  = "pathname"
  #   theme      = "preferred-color-scheme"

  # Addon: Social icons
  [[params.social]]
    name = "github"
    url  = "https://github.com/dizzy-77"

  [[params.social]]
    name = "rss"
    url  = "index.xml"

[languages]
  [languages.en]
    weight    = 1
    copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'
  [languages.en.params]
    subtitle = "Levi7's Blog"

[menu]
  [[menu.main]]
    identifier  = "about"
    name        = "About"
    url         = "about/"
    hasChildren = true

  [[menu.main]]
    identifier = "me"
    name       = "About Me"
    url        = "about/me/"
    parent     = "about"

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "posts/"
